<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Map Demo</title>
<link rel="stylesheet" href="app.css">
<style>
  body { padding: 20px 16px 48px; }
  .bm-wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
  .bm-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bm-top h1 { margin: 0; font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
  .bm-top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .bm-person { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 8px 28px; padding: 18px; }
  @media (max-width: 760px) { .bm-person { grid-template-columns: minmax(0, 1fr); padding: 14px; } }
  .bm-name { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 2px; }
  .bm-arch { font: 650 18px/1.2 var(--f-display); color: var(--lift); margin: 10px 0 4px; letter-spacing: .01em; }
  .bm-sum { color: var(--ink-2); margin: 0 0 8px; }
  .bm-traits { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .bm-traits li { background: var(--surface-3); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .bm-feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .bm-feat div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .bm-feat b { display: block; font: 650 18px/1.2 var(--f-display); }
  .bm-feat span { font-size: 11px; color: var(--muted); }
  .bm-recs { display: grid; gap: 8px; margin-bottom: 16px; }
  .bm-rec { border-left: 3px solid var(--line-2); padding: 6px 10px; background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .bm-rec.warn { border-color: var(--warn); } .bm-rec.good { border-color: var(--good); } .bm-rec.tip { border-color: var(--lift); }
  .bm-rec b { display: block; font-size: 13.5px; }
  .bm-rec p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
  .bm-next { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: color-mix(in srgb, var(--lift) 7%, var(--surface)); }
  .bm-next b { font: 700 19px/1.2 var(--f-display); }
  .bm-next .ex { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .bm-next .ex span { background: var(--lift); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .bm-next small { color: var(--muted); }
  h3.eyebrow { margin: 0 0 8px; }
  #tip { position: fixed; pointer-events: none; z-index: 90; }
</style>
</head>
<body>
<div class="bm-wrap">
  <div class="bm-top">
    <h1>Body map · demo</h1>
    <span class="muted" style="color:var(--muted)">Synthetic histories, last 4 weeks. Hover a muscle.</span>
    <div class="right"><button class="btn secondary sm" id="theme">Toggle theme</button></div>
  </div>
  <div id="people" class="bm-wrap" style="max-width:none"></div>
</div>
<script>
  if (typeof esc === "undefined") window.esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
</script>
<script src="body.js"></script>
<script>
"use strict";
/* tooltip stand-in for ui.js */
(() => {
  const t = document.body.appendChild(Object.assign(document.createElement("div"), {id: "tip"}));
  document.addEventListener("pointermove", e => {
    const el = e.target.closest?.("[data-tip]"); if (!el) { t.style.display = "none"; return; }
    t.textContent = el.dataset.tip; t.style.display = "block"; t.style.left = e.clientX + 14 + "px"; t.style.top = e.clientY + 14 + "px";
  });
})();
const qs = new URLSearchParams(location.search);
if (qs.get("theme")) document.documentElement.dataset.theme = qs.get("theme");
document.getElementById("theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- synthetic histories ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NOW = Math.floor(Date.now() / 1000);
/* plan: list of [daysAgo, [[exercise|null, machine, sets, [repLo, repHi], [restLo, restHi], kg], ...]] */
function build(seed, plan) {
  const r = rng(seed), between = (a, b) => a + r() * (b - a), sets = [], sessions = [];
  for (const [ago, blocks] of plan) {
    let t = NOW - ago * 86400 - 3600 * 3 - Math.round(r() * 1800); const s0 = t - 300; let lift = 0, rest = 0, n = 0;
    for (const [exercise, machine, k, reps, rst, kg] of blocks) for (let i = 0; i < k; i++) {
      const rp = Math.round(between(...reps)), dur = exercise === null && /tread|bike|rower/i.test(machine) ? 600 : Math.round(rp * between(2.2, 3.4) + 4);
      sets.push({exercise, machine, reps: rp, duration_s: dur, start: t, weight_kg: kg}); n++;
      lift += dur; t += dur; const g = Math.round(between(...rst)); rest += g; t += g;
    }
    sessions.push({start: s0, end: t + 240, lifting_s: lift, resting_s: rest, sets: n});
  }
  return {sets, sessions, now: NOW};
}
const pl = (days, A, B) => days.map((d, i) => [d, i % 2 ? B : A]);
const people = [
  {name: "Marta K.", note: "Barbell regular · 3×/week", h: build(7, pl([1, 3, 6, 8, 10, 13, 15, 17, 20, 22, 24, 27], [
      ["squat", "Squat rack", 5, [3, 5], [180, 300], 140], ["bench_press", "Bench press", 5, [3, 5], [180, 260], 90], [null, "Bench press", 3, [5, 6], [150, 200], 70]],
    [["deadlift", "Deadlift platform", 4, [2, 4], [200, 320], 180], ["overhead_press", "Squat rack", 4, [4, 5], [160, 240], 55], ["row", "Back left area", 2, [5, 6], [150, 200], 80]]))},
  {name: "Dev P.", note: "Floor area · 5×/week", h: build(21, pl([0.2, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14, 15, 16, 18, 19, 21, 22, 23, 25, 26], [
      ["burpee", "Back left area", 4, [12, 18], [20, 45]], ["pull_up", "Back left area", 4, [8, 14], [25, 50]], ["jumping", "Back left area", 3, [15, 25], [20, 40]], ["push_up", "Back left area", 3, [15, 25], [20, 40]], [null, "Rower", 1, [1, 1], [30, 50]], ["plank", "Back left area", 2, [1, 1], [20, 30]]],
    [["squat", "Back left area", 4, [12, 20], [25, 55]], ["lunge", "Back left area", 3, [12, 20], [20, 45]], ["deadlift", "Back left area", 3, [10, 15], [30, 55]], ["row", "Back left area", 3, [12, 15], [25, 45]], ["unknown", "Back left area", 2, [10, 20], [20, 40]], ["burpee", "Back left area", 3, [12, 18], [20, 40]]]))},
  {name: "Sam R.", note: "New member · machines", h: build(33, pl([2, 6, 9, 13, 16, 20, 23, 27], [
      [null, "Treadmill", 1, [1, 1], [60, 120]], [null, "Leg press", 3, [10, 12], [90, 150]], [null, "Chest press machine", 3, [10, 12], [90, 160]], [null, "Lat pulldown", 3, [10, 12], [90, 150]], [null, "Pec deck fly", 2, [12, 15], [80, 140]]],
    [[null, "Treadmill", 1, [1, 1], [60, 120]], [null, "Leg extension", 3, [10, 12], [90, 150]], [null, "Shoulder press", 3, [10, 12], [90, 150]], [null, "Cable row", 3, [10, 12], [90, 150]], [null, "Biceps curl machine", 2, [12, 15], [80, 140]]]))},
];

const fmtF = (v, k) => v == null ? "–" : k === "pct" ? Math.round(v * 100) + "%" : k === "rest" ? bmFmtRest(v) : k === "ratio" ? (isFinite(v) ? (+v.toFixed(2)) + ":1" : "∞") : +v.toFixed(1);
document.getElementById("people").innerHTML = people.map(p => {
  const load = bmWeekLoad(p.h), gaps = bmGaps(load), a = bmArchetype(p.h), recs = bmRecommendations(p.h, load), next = bmNextSession(p.h, load), f = a.features;
  const feats = [["Avg reps", f.avg_reps], ["Avg rest", f.avg_rest_s, "rest"], ["Compound", f.compound_share, "pct"], ["Machines", f.machine_share, "pct"],
    ["Lower body", f.split?.lower, "pct"], ["Push:pull", f.push_pull, "ratio"], ["Sessions / wk", f.sessions_per_week], ["Patterns / session", f.patterns_per_session], ["Session min", f.avg_session_min]];
  return `<section class="card bm-person">
    <div><div class="bm-name">${esc(p.name)}</div><div style="color:var(--muted);font-size:12.5px;margin-bottom:10px">${esc(p.note)} · ${bmRecentSets(p.h.sets, 7, NOW).length} sets this week</div>
      ${bmBodyMap(load, {highlight: gaps})}</div>
    <div>
      <h3 class="eyebrow">Training style</h3>
      <div class="bm-arch">${esc(a.name)}</div><p class="bm-sum">${esc(a.summary)}</p>
      <ul class="bm-traits">${a.traits.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="bm-feat">${feats.map(([l, v, k]) => `<div><b class="num">${fmtF(v, k)}</b><span>${l}</span></div>`).join("")}</div>
      <h3 class="eyebrow">Coaching</h3>
      <div class="bm-recs">${recs.map(r => `<div class="bm-rec ${r.level}"><b>${esc(r.title)}</b><p>${esc(r.detail)}</p></div>`).join("")}</div>
      <h3 class="eyebrow">Next session</h3>
      <div class="bm-next"><b>${esc(next.focus)}</b><div class="ex">${next.exercises.map(id => `<span>${esc(BM_EXERCISES[id].name)}</span>`).join("")}</div><small>${esc(next.reason)}</small></div>
    </div></section>`;
}).join("") + `<section class="card" style="padding:18px"><h3 class="eyebrow">Views & legend</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:end">
  <div>${bmBodyMap(bmWeekLoad(people[0].h), {view: "front", legend: false})}</div><div>${bmBodyMap(bmWeekLoad(people[1].h), {view: "back", legend: false})}</div>
  <div>${bmBodyMap({}, {view: "front", legend: false})}</div><div>${bmLegend(true)}</div></div></section>`;
</script>
</body>
</html>
