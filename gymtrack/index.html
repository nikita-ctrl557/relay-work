<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GymTrack</title>
<meta name="description" content="GymTrack turns a gym's existing CCTV into training stats for every member: sets, reps, lifting and rest time, machines used, across multiple cameras.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5bd8'/%3E%3Crect x='7' y='9' width='4' height='14' rx='1.5' fill='white'/%3E%3Crect x='21' y='9' width='4' height='14' rx='1.5' fill='white'/%3E%3Crect x='11' y='14.5' width='10' height='3' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <a class="brand" href="#floor" aria-label="GymTrack home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><rect x="7" y="9" width="4" height="14" rx="1.5" fill="#fff"/><rect x="21" y="9" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="14.5" width="10" height="3" fill="#fff"/></svg>
      <span class="brand-name">Gym<span>Track</span></span>
    </a>
    <div class="gym-card"><span class="gi" id="gymInitial">G</span><div><b id="gymName">Loading…</b><small id="gymMeta"></small></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="sys" id="sysBox">Starting…</div>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button data-theme-set="light" aria-pressed="false">Light</button>
        <button data-theme-set="auto" aria-pressed="true">Auto</button>
        <button data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="appbar">
      <a class="brand" href="#floor" aria-label="GymTrack home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><rect x="7" y="9" width="4" height="14" rx="1.5" fill="#fff"/><rect x="21" y="9" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="14.5" width="10" height="3" fill="#fff"/></svg>
        <span class="brand-name">Gym<span>Track</span></span>
      </a>
      <span class="sysdot" id="sysDot"></span>
    </header>
    <div class="topbar" id="topbar">
      <div><h1 id="pageTitle">Floor</h1><div class="sub" id="pageSub"></div></div>
      <div class="actions" id="pageActions"></div>
    </div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabNav" aria-label="Main navigation"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
